name: Sync Colombia roster from map

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Run roster sync
        run: python3 scripts/sync_roster.py

      - name: Commit roster.json if it changed
        run: |
          if git diff --quiet -- roster.json; then
            echo "No changes to roster.json — skipping commit."
            exit 0
          fi
          git config user.name "roster-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          # Keep the committed fallback snapshot byte-identical to the live
          # file so stats, directory and badge can never disagree.
          cp roster.json data/roster.snapshot.json
          git add roster.json data/roster.snapshot.json
          git commit -m "chore: sync roster.json [skip ci]"
          git push
